// Generate a fresh template at https://fabricmc.net/develop (pick 26.3) and copy its
// plugin id / dependency lines over these if they differ. Minecraft 26.x is unobfuscated: no mappings line.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
	splitEnvironmentSourceSets()
	mods { "flatverity" { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
